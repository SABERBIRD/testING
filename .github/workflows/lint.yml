name: Lint

on:
  push:
    branches-ignore: [no-ci]
  workflow_dispatch:

permissions:
  contents: read
  actions: write # only for the "cancel" scenario (self-cancel)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Scenario
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.run_attempt }}
        run: ./.ci/run.sh lint
